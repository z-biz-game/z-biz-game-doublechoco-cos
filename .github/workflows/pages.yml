name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No bundler: the game ships plain ES modules, so the site is a file copy.
      # 拷贝清单只有一份：tools/assemble-site.sh。pages.yml 不再手抄 cp 行——
      # 手抄的那份与脚本里的那份迟早漂，而漂了就是线上 404 自己的 manifest/sw.js/图标，
      # 本地一切全绿（本地跑的是仓根，仓根永远是对的）。
      # 产物与引用对不上表就不许 deploy：404 的图标与 404 的离线壳在页面上都是沉默的。
      - name: Assemble static site
        run: bash tools/assemble-site.sh _site
      # 资产闸：页面引用的每一条同源路径都要①在仓树里真实存在（PNG 读 magic+IHDR）
      # ②在**那一份清单**（tools/assemble-site.sh）覆盖的产物集合里。
      - name: Ship list covers every same-origin reference
        run: node tools/ship-check.mjs
      # 部署集闸：量的就是即将上传的那份 _site（不是它自己重拷的副本）。
      - name: Deploy set gate (checks the very _site about to be uploaded)
        run: node tools/deploy-set.mjs _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
